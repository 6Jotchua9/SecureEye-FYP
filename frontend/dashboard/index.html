<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var g = function (k) {
            return localStorage.getItem(k);
          };
          if (g("cinq-theme") === "light") d.classList.add("light");
          var c = g("cinq-contrast");
          if (c === "high" || (c === null && matchMedia("(prefers-contrast: more)").matches)) {
            d.classList.add("contrast");
          }
          var m = g("cinq-motion");
          if (m === "reduced") d.setAttribute("data-motion", "reduced");
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0b0a" />
    <title>Gateway admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
